# Builds the Mac app (mac/build.sh) for Apple silicon and Intel and attaches the DMGs to a GitHub Release.
#
# Releases go out on their own once a day at 07:00 UTC, when main changed since the last release: the
# next patch version (v0.1.0 -> v0.1.1) is tagged once both builds pass, so a failed build releases nothing.
# The notes list what's new: the CHANGELOG.md headlines added since the last release (tools/release_notes.py).
# Installed apps offer the new version, with that list, the next time they open. Other ways to run it:
#   git tag v0.2.0 && git push origin v0.2.0      a release now, with a version you choose
#   Actions > Mac app > Run workflow                a test build; tick "release" to publish it as the next version
#
# The DMGs go out ad-hoc signed, and people allow the app once in System Settings > Privacy & Security, until
# mac/sign-release.sh signs and notarizes them on a Mac that has the Developer ID certificate, which keeps the
# key off GitHub (mac/auto-sign.sh --install has that Mac do it within the hour). The workflow can sign and
# notarize here instead if the repo has these secrets:
#   MAC_CERT_P12          base64 of a "Developer ID Application" certificate exported as .p12
#   MAC_CERT_PASSWORD     that .p12's password
#   NOTARY_KEY_P8         base64 of an App Store Connect API key (.p8) with Developer access
#   NOTARY_KEY_ID         its key ID
#   NOTARY_ISSUER         its issuer ID
name: Mac app

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 7 * * *"            # once a day, 07:00 UTC
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as the next version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      since: ${{ steps.v.outputs.since }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then           # a tag someone pushed
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=1" >> "$GITHUB_OUTPUT"; echo "since=$last" >> "$GITHUB_OUTPUT"; echo "build=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"; major=${major#v}
          next="v$major.$minor.$((patch + 1))"
          changed=1
          if [ -n "$last" ] && [ "$(git rev-list --count "$last"..HEAD)" = 0 ]; then changed=""; fi
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            [ -n "$changed" ] || { echo "Nothing new since $last: no release."; exit 0; }
            release=1
          else                                               # Run workflow: a test build unless "release" is ticked
            release=""; [ "$WANT_RELEASE" = true ] && [ -n "$changed" ] && release=1
          fi
          version=${next#v}; [ -n "$release" ] || version="$version-test"
          echo "tag=$next" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"; echo "since=$last" >> "$GITHUB_OUTPUT"; echo "build=1" >> "$GITHUB_OUTPUT"
          echo "Building $version (release: ${release:-no}; last release $last)"

  build:
    needs: version
    if: needs.version.outputs.build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Signing certificate
        id: cert
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "sign=" >> "$GITHUB_OUTPUT"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; PW=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "sign=1" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARGS=(--version "$VERSION" --repo "$GITHUB_REPOSITORY" --arch "${{ matrix.arch }}")
          if [ -z "${{ steps.cert.outputs.sign }}" ]; then
            ARGS+=(--no-sign)
          elif [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            ARGS+=(--notarize)
          fi
          mac/build.sh "${ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: build/Job-Oyster-*.dmg

  release:
    needs: [version, build]
    if: needs.version.outputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dmgs
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SINCE: ${{ needs.version.outputs.since }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            {
              echo "The latest Job Oyster${SINCE:+, with everything changed since $SINCE}."
              echo
              news=""; [ -z "$SINCE" ] || news=$(python3 tools/release_notes.py "$SINCE")
              if [ -n "$news" ]; then echo "## What's new"; echo; echo "$news"; echo; fi
              echo "**Download:** \`Job-Oyster-${TAG#v}-arm64.dmg\` for Apple silicon (M1 and later), \`Job-Oyster-${TAG#v}-x86_64.dmg\` for Intel."
              echo
              echo "**Coming from Job Search?** It's the same app with a new name. Open Job Oyster and it offers to move the old app to the Trash; your profile folder moves from ~/JobSearch to ~/JobOyster by itself."
              echo
              echo "**Already have it?** Quit Job Oyster, open the new DMG and drag the app into Applications to replace the old one. Your profile folder (~/JobOyster) and everything in it stay as they are."
              echo
              echo "**New here?** Drag the app into Applications and open it. If macOS says it can't check the app, open System Settings > Privacy & Security and click Open Anyway (once). Then follow [Get started](https://github.com/$GITHUB_REPOSITORY#get-started) to make it yours."
              if [ -n "$SINCE" ]; then echo; echo "Every change: https://github.com/$GITHUB_REPOSITORY/compare/$SINCE...$TAG"; fi
            } > notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Job Oyster ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" dmgs/*.dmg -R "$GITHUB_REPOSITORY" --clobber
